[project]
name = "helios"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stane", email = "stanek.petr.19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["scikit-learn>=1.8.0,<2", "pytest>=9.0.3,<10", "ruff>=0.15.12,<0.16", "mypy>=2.1.0,<3", "ipykernel>=7.2.0,<8", "jupyter>=1.1.1,<2"]

[project.scripts]
helios = "helios:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
helios = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.4.3,<3"
pandas = ">=3.0.3,<4"
scipy = ">=1.17.1,<2"
matplotlib = ">=3.10.9,<4"
